# Drop-in for docker.service installed by Trakend OS.
# SOURCE OF TRUTH: installer/systemd/docker.service.d/trakend.conf in the Trakend OS repo.
# Docker's data-root is /data/docker (see /etc/docker/daemon.json); never let
# dockerd start before /data/docker is actually mounted.
# docker.service and docker.socket stay DISABLED: the Trakend array starts Docker.
[Unit]
RequiresMountsFor=/data/docker
